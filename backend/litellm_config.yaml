  - model_name: anthropic/claude-3.5-sonnet
    litellm_params:
      model: openai/os.environ/VLLM_MODEL_ID
      api_base: os.environ/VLLM_BASE_URL
      api_key: os.environ/VLLM_API_KEY

  - model_name: google/gemini-3-flash-preview
    litellm_params:
      model: openai/os.environ/VLLM_MODEL_ID
      api_base: os.environ/VLLM_BASE_URL
